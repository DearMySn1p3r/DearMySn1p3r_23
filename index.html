<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pair Frame - Refined</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,400;1,600&family=Outfit:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#e8a0a0;--ps:rgba(232,160,160,.2);--pbg:#fbe8e8;
  --pp:#fff5f5;--w:#fff;--tx:#4a3a3a;--mt:#d2b4b4;--bl:#5b9bd5;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Outfit','Noto Sans KR',sans-serif;
  background:var(--pp);
  display:flex;align-items:center;justify-content:center;
}

/* ════════ BACKGROUND (은은한 도트) ════════ */
.bg{
  position:fixed;inset:0;
  background:var(--pbg);
  z-index:0;
}
.bg::before{
  content:'';position:absolute;inset:0;
  /* 도트 색상을 더 연하게(0.15) 조정 */
  background-image:radial-gradient(circle,rgba(255,255,255,.15) 1.2px,transparent 1.2px);
  background-size:14px 14px;
}

.scroll{
  position:relative;z-index:1;
  width:100%;height:100%;
  overflow-y:auto;
  display:flex;justify-content:center;
  padding:40px 16px 120px;
  scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}

#capture{
  display:flex;flex-direction:column;align-items:center;
  width:400px;flex-shrink:0;
}

/* PAIR NAME TOP */
.pn-top{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-weight:600;font-size:32px;
  letter-spacing:2px;color:rgba(255,255,255,.6);
  margin-bottom:18px; /* 간격 확보 */
  outline:none;
}

/* CARD AREA */
.card{
  background:var(--w);border-radius:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.04);
  width:340px;position:relative;
}

.ch{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.cav{width:34px;height:34px;border-radius:50%;background:var(--ps)}
.cu{font-size:12px;font-weight:500;color:var(--bl);display:flex;align-items:center;gap:4px}
.cf{font-size:10px;color:var(--mt);margin-top:2px}
.cf b{color:var(--tx)}

/* IMAGE BOX - 꽉 차게, 억지로 늘리지 않음 */
.iw{
  margin:0 12px;border-radius:14px;
  background:#f9f9f9;aspect-ratio:1/1;
  overflow:hidden;position:relative;
}
.ii{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.uimg{
  /* 비율 유지하며 꽉 채움 */
  width:100%;height:100%;object-fit:cover;
  display:block;
}

/* TAGS */
.tag{
  position:absolute;
  background:rgba(232,160,160,.8);backdrop-filter:blur(4px);
  color:#fff;font-size:11px;padding:4px 10px;border-radius:6px;
  cursor:grab;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.cnav{display:flex;justify-content:center;gap:22px;padding:14px}
.cni svg{width:20px;height:20px;color:var(--p)}

/* SEARCH BAR */
.sbar{
  width:340px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.6);backdrop-filter:blur(10px);
  border-radius:25px;padding:8px 14px;
  margin-top:14px; /* PAIR NAME과 피드 사이 공백 */
}
.sbar svg{width:12px;height:12px;color:var(--mt)}
.sbar input{
  border:none;background:transparent;outline:none;
  font-size:11px;color:var(--tx);width:100%;
}

/* FEED / PROFILE BOX */
.bc2{
  width:340px;
  background:rgba(255,255,255,.7);backdrop-filter:blur(10px);
  border-radius:18px;padding:12px;margin-top:14px;
  display:flex;gap:10px;
}
.bav{width:40px;height:40px;border-radius:50%;background:var(--ps)}
.bcu{font-size:12px;font-weight:500;color:var(--bl);outline:none}
.bcf{font-size:10px;color:var(--mt);margin:2px 0 4px}
.bio{font-size:10px;color:var(--mt);line-height:1.5;outline:none}

/* ════════ TOOLBAR (캡쳐 시 제외) ════════ */
.toolbar{
  position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
  background:#fff;border-radius:50px;padding:8px 16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.1);z-index:100;
}
.tb{
  background:var(--p);color:#fff;border:none;padding:8px 16px;
  border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;
  transition:transform .2s;
}
.tb:hover{transform:translateY(-2px)}
.tb.sub{background:#f0f0f0;color:#888}

#fileIn{display:none}
.toast{
  position:fixed;top:20px;background:rgba(0,0,0,.7);color:#fff;
  padding:8px 16px;border-radius:10px;font-size:12px;opacity:0;transition:0.3s;
}
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*">

<div class="scroll">
  <div id="capture">
    <!-- 상단 텍스트 -->
    <div class="pn-top" contenteditable="true">PAIR NAME</div>

    <!-- 메인 카드 -->
    <div class="card">
      <div class="ch">
        <div class="cav"></div>
        <div>
          <div class="cu">@NAME_ID</div>
          <div class="cf"><b>1</b> Followers <b>1</b> Following</div>
        </div>
      </div>

      <div class="iw">
        <div class="ii" id="imgInner">
          <div style="color:#ddd; font-size:12px;">No Image Selected</div>
        </div>
        <div class="tag" style="left:15px; bottom:20px;">@NAME_ID</div>
        <div class="tag" style="right:15px; top:15px;">@NAME_ID</div>
      </div>

      <div class="cnav">
        <div class="cni"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
        <div class="cni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="16.65" y1="16.65" x2="21" y2="21"/></svg></div>
      </div>
    </div>

    <!-- 검색바 -->
    <div class="sbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="16.65" y1="16.65" x2="21" y2="21"/></svg>
      <input value="#PAIR NAME">
    </div>

    <!-- 하단 피드 박스 -->
    <div class="bc2">
      <div class="bav"></div>
      <div>
        <div class="bcu" contenteditable="true">@NAME_ID</div>
        <div class="bcf"><b>1</b> Followers <b>1</b> Following</div>
        <div class="bio" contenteditable="true">
          TEXT TEXT TEXT TEXT TEXT TEXT TEXT<br>
          TEXT TEXT TEXT TEXT TEXT TEXT TEXT
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 하단 도구 모음 (캡쳐 안됨) -->
<div class="toolbar">
  <button class="tb sub" onclick="document.getElementById('fileIn').click()">사진 변경</button>
  <button class="tb" onclick="exportImg()">이미지 저장 (PNG)</button>
</div>

<script>
const fileIn = document.getElementById('fileIn');
const imgInner = document.getElementById('imgInner');

// 이미지 업로드 로직
fileIn.onchange = e => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = ev => {
      imgInner.innerHTML = `<img src="${ev.target.result}" class="uimg">`;
    };
    reader.readAsDataURL(file);
  }
};

// 캡쳐 및 저장
async function exportImg() {
  const cap = document.getElementById('capture');
  const bg = document.getElementById('bg');
  
  // 가상 캔버스 생성 (배경 도트 포함)
  const wrapper = document.createElement('div');
  wrapper.style.cssText = `
    position:fixed; left:-9999px; top:0; 
    width:500px; padding:50px; 
    background:${getComputedStyle(bg).backgroundColor}; 
    display:flex; justify-content:center;
  `;
  
  // 도트 복제
  const dotLayer = document.createElement('div');
  dotLayer.style.cssText = `
    position:absolute; inset:0; 
    background-image:radial-gradient(circle,rgba(255,255,255,.15) 1.2px,transparent 1.2px);
    background-size:14px 14px;
  `;
  wrapper.appendChild(dotLayer);
  
  const clone = cap.cloneNode(true);
  clone.style.position = "relative";
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);

  try {
    const canvas = await html2canvas(wrapper, {
      scale: 3,
      backgroundColor: null,
      useCORS: true
    });
    const link = document.createElement('a');
    link.download = 'pair-frame-result.png';
    link.href = canvas.toDataURL();
    link.click();
    showToast("저장 완료!");
  } catch (err) {
    console.error(err);
  } finally {
    document.body.removeChild(wrapper);
  }
}

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2000);
}

// 태그 드래그 가능하게 만들기
document.querySelectorAll('.tag').forEach(tag => {
  let isDragging = false;
  tag.onmousedown = e => { isDragging = true; };
  document.onmousemove = e => {
    if (!isDragging) return;
    const rect = document.querySelector('.iw').getBoundingClientRect();
    tag.style.left = (e.clientX - rect.left - 20) + 'px';
    tag.style.top = (e.clientY - rect.top - 10) + 'px';
    tag.style.right = 'auto'; tag.style.bottom = 'auto';
  };
  document.onmouseup = () => { isDragging = false; };
});
</script>
</body>
</html>
